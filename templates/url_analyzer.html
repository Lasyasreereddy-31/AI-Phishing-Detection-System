<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>URL Analyzer</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background:#f4f6f9;
        }

        .card{
            margin-top:70px;
            border:none;
            border-radius:15px;
            box-shadow:0px 5px 20px rgba(0,0,0,0.15);
        }

        h1{
            color:#0d6efd;
            font-weight:bold;
        }
    </style>

</head>

<body>

<div class="container">

<div class="card p-5">

<h1 class="text-center mb-4">
🌐 URL Phishing Analyzer
</h1>

<form action="/analyze_url" method="POST">

<div class="mb-3">

<label class="form-label">
Enter Website URL
</label>

<input
type="text"
name="url"
class="form-control form-control-lg"
placeholder="https://example.com"
required>

</div>

<div class="text-center">

<button class="btn btn-primary btn-lg">

Analyze URL

</button>

</div>

</form>

<br>

<div class="text-center">

<a href="/" class="btn btn-secondary">

⬅ Back to Home

</a>

</div>

</div>

</div>

</body>
</html>
